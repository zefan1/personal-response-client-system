appId: com.privateflow.desktop
productName: Private Domain Assistant
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
npmRebuild: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dir
  identity: null
linux:
  target:
    - dir
