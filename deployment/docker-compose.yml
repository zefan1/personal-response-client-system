name: private-domain-assistant

services:
  db:
    image: docker.m.daocloud.io/library/mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - pda_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [pda]

  redis:
    image: docker.m.daocloud.io/library/redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - pda_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [pda]

  volume-init:
    image: docker.m.daocloud.io/library/alpine:3.20
    restart: "no"
    command: ["sh", "-c", "mkdir -p /data/uploads/desktop-releases /data/uploads/quick-search /data/uploads/arrival-reports /data/uploads/temporary-recognition && chown -R 999:988 /data"]
    volumes:
      - pda_uploads:/data

  backend:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    user: "999:988"
    environment:
      SERVER_PORT: 8080
      APP_ENV: production
      MOCK_EXTERNALS: ${MOCK_EXTERNALS}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SYSTEM_JWT_SECRET: ${SYSTEM_JWT_SECRET}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://${PDA_DOMAIN}:${PDA_HTTP_PORT},http://${PDA_DOMAIN}}
      WECOM_TRANSPORT_MODE: ${WECOM_TRANSPORT_MODE}
      WECOM_RELAY_BASE_URL: ${WECOM_RELAY_BASE_URL}
      WECOM_RELAY_KEY_ID: ${WECOM_RELAY_KEY_ID}
      WECOM_RELAY_SECRET: ${WECOM_RELAY_SECRET}
      WECOM_CORP_ID: ${WECOM_CORP_ID}
      WECOM_APP_SECRET: ${WECOM_APP_SECRET}
      WECOM_API_BASE_URL: ${WECOM_API_BASE_URL}
      WECOM_SMARTSHEET_DOC_ID: ${WECOM_SMARTSHEET_DOC_ID}
      WECOM_SMARTSHEET_SHEET_ID: ${WECOM_SMARTSHEET_SHEET_ID}
      WECOM_SMARTSHEET_VIEW_ID: ${WECOM_SMARTSHEET_VIEW_ID}
      WECOM_SMARTSHEET_SOURCE_TABLE: ${WECOM_SMARTSHEET_SOURCE_TABLE}
      WECOM_SMARTSHEET_UNIQUE_FIELD_TITLE: ${WECOM_SMARTSHEET_UNIQUE_FIELD_TITLE}
      WECOM_CALLBACK_TOKEN: ${WECOM_CALLBACK_TOKEN}
      WECOM_CALLBACK_ENCODING_AES_KEY: ${WECOM_CALLBACK_ENCODING_AES_KEY}
      VERSION_STORAGE_ROOT: /data/private-domain-assistant/uploads/desktop-releases
      QUICKSEARCH_STORAGE_ROOT: /data/private-domain-assistant/uploads/quick-search
      ARRIVAL_REPORT_STORAGE_ROOT: /data/private-domain-assistant/uploads/arrival-reports
      CHAT_RECOGNITION_APPLICATION_TEMP_ROOT: /data/private-domain-assistant/uploads/temporary-recognition
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: ${MAX_FILE_SIZE}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - pda_uploads:/data/private-domain-assistant
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      volume-init: { condition: service_completed_successfully }
    networks: [pda]

  frontend:
    build:
      context: ..
      dockerfile: desktop/Dockerfile.web
      args:
        VITE_DEFAULT_API_BASE_URL: ${VITE_DEFAULT_API_BASE_URL}
    restart: unless-stopped
    networks: [pda]

  edge:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PDA_HTTP_PORT}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - pda_uploads:/data/private-domain-assistant:ro
    depends_on: [backend, frontend]
    networks: [pda]

volumes:
  pda_db:
  pda_redis:
  pda_uploads:

networks:
  pda:
