server {
    listen 80;
    server_name _;
    client_max_body_size 600m;

    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /admin/api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /downloads/desktop-releases/ {
        alias /data/private-domain-assistant/uploads/desktop-releases/;
        add_header Cache-Control "private, max-age=3600";
    }

    location /uploads/quick-search/ {
        alias /data/private-domain-assistant/uploads/quick-search/;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        proxy_pass http://frontend:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
