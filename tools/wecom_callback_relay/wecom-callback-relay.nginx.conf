# Include this location in the existing HTTPS server block for sy.xn--15tq51d.top.
location = /wecom/smartsheet/callback {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
    client_max_body_size 256k;
}

location ^~ /wecom/smartsheet/internal/ {
    proxy_pass http://127.0.0.1:18082;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 15s;
    client_max_body_size 256k;
}
